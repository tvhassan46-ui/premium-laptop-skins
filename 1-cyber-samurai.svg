<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
<defs>
<linearGradient id="darkBg" x2="0" y2="1">
<stop offset="0%" stop-color="#0a0a0f"/>
<stop offset="50%" stop-color="#1a0f1f"/>
<stop offset="100%" stop-color="#0d0510"/>
</linearGradient>
<radialGradient id="redGlow" cx="45%" cy="40%">
<stop offset="0%" stop-color="#ff1144" stop-opacity="0.8"/>
<stop offset="40%" stop-color="#cc0033" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#ff1144" stop-opacity="0"/>
</radialGradient>
<radialGradient id="blueGlow" cx="55%" cy="60%">
<stop offset="0%" stop-color="#00ccff" stop-opacity="0.7"/>
<stop offset="40%" stop-color="#0099cc" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
</radialGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="4" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="softGlow">
<feGaussianBlur stdDeviation="8" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="smoke">
<feGaussianBlur stdDeviation="12"/>
<feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
</filter>
</defs>
<rect width="1400" height="950" fill="url(#darkBg)"/>
<ellipse cx="700" cy="400" rx="600" ry="400" fill="url(#redGlow)"/>
<ellipse cx="800" cy="500" rx="500" ry="350" fill="url(#blueGlow)"/>
