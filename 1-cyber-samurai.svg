<path d="M600 280 Q650 250 700 280 Q700 320 650 340 Q600 330 600 280" fill="#00ccff" opacity="0.25" filter="url(#glow)"/>
<line x1="600" y1="400" x2="700" y2="420" stroke="#ff1144" stroke-width="8" opacity="0.6" filter="url(#glow)"/>
<line x1="610" y1="450" x2="690" y2="470" stroke="#00ccff" stroke-width="6" opacity="0.5" filter="url(#glow)"/>
</g>
