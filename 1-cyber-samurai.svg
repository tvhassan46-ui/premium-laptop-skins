<path d="M500 600 Q480 500 520 400 Q540 300 500 200" stroke="#ff1144" stroke-width="40" fill="none" opacity="0.3"/>
<path d="M700 700 Q680 550 740 350 Q780 200 700 100" stroke="#ff1144" stroke-width="50" fill="none" opacity="0.25"/>
<path d="M900 650 Q920 500 880 350 Q850 200 900 50" stroke="#00ccff" stroke-width="45" fill="none" opacity="0.2"/>
</g>
<g>
